name: Build Android APK

on:
workflow_dispatch:
push:
branches:
- main

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout
uses: actions/checkout@v4

  - name: Extract Firebase project
    run: |
      mkdir -p project
      unzip -q "Dar-dikor-2022-Firebase-READY.zip" -d project
      PROJECT_DIR="project"
      test -f "$PROJECT_DIR/settings.gradle"
      test -f "$PROJECT_DIR/app/build.gradle"
      echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: "8.10.2"

  - name: Build Android APK
    run: |
      cd "$PROJECT_DIR"
      gradle clean assembleDebug --stacktrace

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: Dar-dikor-APK
      path: project/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
