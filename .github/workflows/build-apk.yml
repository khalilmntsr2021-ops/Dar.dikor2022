name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir -p project
          unzip -q "Dar-dikor-V9-UPDATED.zip" -d project
          PROJECT_DIR="$(dirname "$(find project -name settings.gradle -o -name settings.gradle.kts | head -n 1)")"
          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "project" ]; then
            PROJECT_DIR="project"
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java      - name: Add product form
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("project")
          files = [
              p for p in root.rglob("index.html")
              if "build" not in p.parts
              and "node_modules" not in p.parts
          ]

          if not files:
              raise SystemExit("ERROR: index.html not found")

          target = next(
              (p for p in files if "assets" in p.parts),
              files[0]
          )

          html = target.read_text(encoding="utf-8")

          marker = "dikourat-product-manager"

          if marker not in html:
              code = r'''
          <!-- dikourat-product-manager -->
          <style>
          #dk-add{position:fixed;right:15px;bottom:18px;z-index:9999;background:#087f5b;color:white;border:0;border-radius:30px;padding:14px;font-size:16px}
          #dk-form{display:none;position:fixed;inset:0;z-index:10000;background:#0008;overflow:auto;padding:15px}
          #dk-box{background:white;color:#222;max-width:450px;margin:25px auto;padding:18px;border-radius:14px;font-family:Arial}
          #dk-box input,#dk-box select,#dk-box textarea{box-sizing:border-box;width:100%;padding:11px;margin:6px 0 12px}
          #dk-box button{padding:10px;margin:4px}
          #dk-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
          .dk-card{border:1px solid #ddd;border-radius:10px;padding:9px;overflow-wrap:anywhere}
          .dk-card img{width:100%;height:110px;object-fit:contain}
          </style>

          <button id="dk-add" type="button">＋ إضافة منتوج</button>
          <div id="dk-form">
          <div id="dk-box">
          <h2>إضافة منتوج جديد</h2>
          <label>اسم المنتوج</label>
          <input id="dk-name" placeholder="اسم الصباغة">
          <label>العلامة التجارية</label>
          <select id="dk-brand"><option>FACOP</option><option>ATLAS</option><option>أخرى</option></select>
          <label>ثمن البيع بالدرهم</label>
          <input id="dk-price" type="number" min="0" step="0.01" placeholder="الثمن">
          <label>رابط صورة المنتوج</label>
          <input id="dk-image" placeholder="رابط الصورة (اختياري)">
          <label>معلومات إضافية</label>
          <textarea id="dk-info" placeholder="الحجم والألوان والاستعمال"></textarea>
          <button id="dk-save" type="button">حفظ المنتوج</button>
          <button id="dk-close" type="button">إغلاق</button>
          </div>
          </div>
          <section style="padding:12px">
          <h2>المنتوجات المضافة</h2>
          <div id="dk-list"></div>
          </section>

          <script>
          (function(){
            const key='dikourat_products_v1';
            const $=id=>document.getElementById(id);
            const read=()=>{try{return JSON.parse(localStorage.getItem(key)||'[]')}catch(e){return []}};
            const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
            function render(){
              $('dk-list').innerHTML='';
              read().forEach((p,i)=>{
                const card=document.createElement('div');
                card.className='dk-card';
                card.innerHTML=(p.image?'<img src="'+esc(p.image)+'">':'<div style="font-size:40px">🎨</div>')+
                '<b>'+esc(p.name)+'</b><p>'+esc(p.brand)+'</p><b>'+esc(p.price)+' DH</b><p>'+esc(p.info)+'</p>'+
                '<button type="button" data-del="'+i+'">حذف</button>';
                $('dk-list').appendChild(card);
              });
            }
            $('dk-add').onclick=()=>{$('dk-form').style.display='block'};
            $('dk-close').onclick=()=>{$('dk-form').style.display='none'};
            $('dk-save').onclick=()=>{
              const name=$('dk-name').value.trim(),price=$('dk-price').value;
              if(!name){alert('دخل اسم المنتوج');return}
              if(price===''||Number(price)<0){alert('دخل الثمن');return}
              const a=read();
              a.unshift({name,brand:$('dk-brand').value,price:Number(price).toFixed(2),image:$('dk-image').value.trim(),info:$('dk-info').value.trim()});
              localStorage.setItem(key,JSON.stringify(a));
              ['dk-name','dk-price','dk-image','dk-info'].forEach(id=>$(id).value='');
              $('dk-form').style.display='none';render();alert('تم حفظ المنتوج');
            };
            $('dk-list').onclick=e=>{
              const b=e.target.closest('[data-del]');
              if(!b)return;
              const a=read();a.splice(Number(b.dataset.del),1);
              localStorage.setItem(key,JSON.stringify(a));render();
            };
            render();
          })();
          </script>
          '''
              if "</body>" in html:
                  html = html.replace("</body>", code + "\n</body>", 1)
              else:
                  html += code

              target.write_text(html, encoding="utf-8")

          print("Product form added to", target)
          PY
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle clean assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DikouratSbagha-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
